name: Fetch and save random Pokemon

on:
  schedule:
    - cron: '0 12 * * *'  # Runs at 12:00 UTC daily
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write

jobs:
  fetch-and-save-pokemon:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests
    
    - name: Run tests
      run: pytest -v

    - name: Create directories
      run: |
        mkdir -p logs
        mkdir -p pokemon_data
    
    - name: Fetch next Pokemon in no-repeat rotation and save response
      run: |
        python - <<'PY'
        import json
        import random
        from datetime import datetime
        from pathlib import Path
        from unittest.mock import patch
        from pokemon_api import fetch_random_pokemon

        MAX_POKEMON_ID = 1025
        state_file = Path('pokemon_data/rotation.json')

        # Load the remaining IDs from the previous run. If there is no state
        # yet (or the previous cycle is complete), create a fresh shuffled deck.
        remaining = []
        cycle = 1
        if state_file.exists():
            try:
                state = json.loads(state_file.read_text())
                remaining = state.get('remaining', [])
                cycle = state.get('cycle', 1)
            except (json.JSONDecodeError, OSError):
                remaining = []

        if not remaining:
            remaining = list(range(1, MAX_POKEMON_ID + 1))
            random.shuffle(remaining)
            if state_file.exists():
                cycle += 1

        pokemon_id = remaining.pop()

        # Keep the existing API/output behavior, but force the selected ID
        # instead of allowing fetch_random_pokemon() to pick another random one.
        with patch('random.randint', return_value=pokemon_id):
            pokemon_data = fetch_random_pokemon()

        now = datetime.now()
        data_entry = {
            'timestamp': now.isoformat(),
            'pokemon_data': pokemon_data
        }

        # Save to response.json for TRMNL polling.
        with open('pokemon_data/response.json', 'w') as f:
            json.dump(data_entry, f, indent=2)

        # Persist the unused IDs so no Pokemon repeats during this cycle.
        state = {
            'cycle': cycle,
            'last_pokemon_id': pokemon_id,
            'remaining_count': len(remaining),
            'remaining': remaining
        }
        state_file.write_text(json.dumps(state, indent=2))

        # Keep the existing dated log behavior.
        log_file = f'logs/pokemon_{now.strftime("%Y-%m-%d")}.json'
        with open(log_file, 'w') as f:
            json.dump(data_entry, f, indent=2)

        print(f'Selected Pokemon ID {pokemon_id}; {len(remaining)} remain in cycle {cycle}.')
        PY

    - name: Commit and push latest Pokemon
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add pokemon_data/response.json pokemon_data/rotation.json
        git commit -m "Update Pokemon of the day" || exit 0
        git push
    
    - name: Upload log
      uses: actions/upload-artifact@v7
      with:
        name: pokemon-logs
        path: logs/*.json
        retention-days: 30
